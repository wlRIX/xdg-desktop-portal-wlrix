# Which backend implements which portal interface under wlRIX.
#
# The filename matters and is easy to get wrong: xdg-desktop-portal looks for
# `DESKTOP-portals.conf` where DESKTOP is the XDG_CURRENT_DESKTOP entry **case-folded to
# lower case** (portals.conf(5)). wlrix-session sets XDG_CURRENT_DESKTOP=wlRIX, so this file
# is `wlrix-portals.conf`. Naming it `wlRIX-portals.conf` produces no error anywhere -- screen
# sharing just silently reports no sources.
#
# `wlrix` on the right-hand side names portals/wlrix.portal, not the desktop.

[preferred]
org.freedesktop.impl.portal.ScreenCast=wlrix
org.freedesktop.impl.portal.Screenshot=wlrix
# Settings is what tells a toolkit the window-button order and whether the scheme is dark. It has
# to be claimed: a portal answering Settings **overrides** ~/.config/gtk-3.0/settings.ini, so
# without this a GTK window keeps whatever button layout the fallback backend reports -- which on
# a machine with the GNOME one installed is its own default, close button and all.
#
# Claiming it takes the whole interface, so this backend answers `NotFound` for every key it does
# not own (the font, the cursor theme) rather than inventing one. That is what leaves settings.ini
# in charge of the rest.
org.freedesktop.impl.portal.Settings=wlrix
# The file dialog every sandboxed application opens, and the reason there is a wlRIX one at all:
# without this a Flatpak browser puts a GTK chooser in the middle of an IRIX desktop, with GTK's
# bookmarks rather than the file manager's. `wlrix-file-picker` is built on the file manager's
# own Wlrix.Files.Core, so the two agree about names, icons and places.
#
# Claiming it takes all three of OpenFile, SaveFile and SaveFiles -- one entry names a whole
# interface. All three are implemented; if one ever is not, this line has to go rather than the
# method, or an application that worked under `default=gtk` starts getting a D-Bus error.
org.freedesktop.impl.portal.FileChooser=wlrix
# Everything this backend does not implement falls through to whatever else is installed.
# RemoteDesktop is deliberately not claimed: it needs input injection the compositor does not
# have. Screenshot *is* claimed, and note that claiming it takes PickColor with it -- one entry
# names a whole interface, and there is no way to hand a single method back to another backend.
default=gtk
