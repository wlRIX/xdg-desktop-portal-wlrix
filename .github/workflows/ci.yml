name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Unlike the other wlRIX Rust components, this one links C libraries, none with a vendored
      # fallback. `pipewire-sys` and `libspa-sys` find theirs through pkg-config (clang is for
      # their bindgen), so a missing one is a clear build-script error.
      #
      # **libgbm is not like that.** `gbm-sys` ships pre-generated bindings, runs no build script
      # and asks pkg-config nothing -- it is a bare `#[link(name = "gbm")]`, so the first and only
      # thing that notices its absence is the linker. That makes it invisible to `cargo fmt` and
      # `cargo clippy`, which never link: those two steps going green says nothing about whether
      # the C libraries are here. It also has to be `libgbm-dev` and not the `libgbm1` that mesa
      # already pulls in, because `-lgbm` needs the unversioned `.so` symlink.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libgbm-dev clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --verbose
      # The tests touch neither a compositor, a bus nor PipeWire: anything that needs one of
      # those is verified by hand against a running session, as the README describes.
      - name: Test
        run: cargo test --verbose
